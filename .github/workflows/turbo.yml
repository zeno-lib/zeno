# Turbo repo GitHub Actions documentation:
# https://turbo.build/repo/docs/guides/ci-vendors/github-actions

name: Turbo CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  ci:
    name: Continuous Integration
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SUPABASE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    # TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    # TURBO_CACHE: remote:rw
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: pnpm --filter @zeno-lib/e2e exec playwright install --with-deps chromium
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v2
      with:
        version: 2.84.1
    - name: Start Supabase
      working-directory: packages/db
      run: supabase start -x=postgres-meta,studio,logflare,supavisor
    - name: Run turbo ci command
      run: pnpm run ci
    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: packages/e2e/playwright-report/
        retention-days: 30
